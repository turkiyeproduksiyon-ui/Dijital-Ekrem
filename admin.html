<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dijital Ekrem — Yönetim Paneli</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0f0f10; --panel:#1a1a1d; --line:#2a2a2e;
  --text:#f2f2f3; --text-dim:#9a9aa2; --red:#c1392b;
}
*{box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;margin:0;padding:20px;}
.wrap{max-width:600px;margin:0 auto;}
h1{font-size:18px;margin:0 0 20px;}
input,button,textarea{
  width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:10px;font-family:inherit;
}
button{cursor:pointer;background:var(--red);border:none;font-weight:700;}
button:hover{opacity:0.9;}
#loginBox{max-width:320px;margin:60px auto;}
#panelBox{display:none;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;}
.foto-item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
.foto-item img{width:60px;height:60px;object-fit:cover;border-radius:6px;flex-shrink:0;}
.foto-item .info{flex:1;font-size:12.5px;color:var(--text-dim);}
.foto-item button{width:auto;padding:6px 12px;font-size:12px;}
.logout{background:none;border:1px solid var(--line);color:var(--text-dim);width:auto;padding:6px 12px;font-size:12px;float:right;}
</style>
</head>
<body>
<div class="wrap">

  <div id="loginBox">
    <h1>Dijital Ekrem — Giriş</h1>
    <input type="email" id="loginEmail" placeholder="E-posta">
    <input type="password" id="loginSifre" placeholder="Şifre">
    <button id="loginBtn">Giriş Yap</button>
    <div id="loginDurum" style="font-size:12.5px;color:var(--text-dim);margin-top:8px;"></div>
  </div>

  <div id="panelBox">
    <button class="logout" id="logoutBtn">Çıkış</button>

    <h1>Ana Sayfa Slider</h1>
    <div class="card">
      <label style="font-size:12.5px;color:var(--text-dim);">Yeni Slider Görseli</label>
      <input type="file" id="sliderInput" accept="image/*">
      <input type="text" id="sliderBaslik" placeholder="Başlık (isteğe bağlı)">
      <input type="text" id="sliderAltYazi" placeholder="Alt yazı (isteğe bağlı)">
      <input type="text" id="sliderSira" placeholder="Sıra No (isteğe bağlı)">
      <button id="sliderYukleBtn">Yükle</button>
      <div id="sliderDurum" style="font-size:12.5px;color:var(--text-dim);"></div>
    </div>
    <div class="card">
      <div id="sliderListe"></div>
    </div>

    <h1>Ürünler</h1>
    <div class="card">
      <label style="font-size:12.5px;color:var(--text-dim);">Yeni Ürün Ekle</label>
      <select id="urunKategori">
        <option value="Fotoğraf Makineleri">Fotoğraf Makineleri</option>
        <option value="Objektifler">Objektifler</option>
        <option value="Video Kameralar">Video Kameralar</option>
        <option value="Drone">Drone</option>
        <option value="Tripod / Monopod">Tripod / Monopod</option>
        <option value="Stüdyo ve Işık">Stüdyo ve Işık</option>
        <option value="Aksesuar">Aksesuar</option>
        <option value="Ses">Ses</option>
        <option value="Hafıza Kartları">Hafıza Kartları</option>
        <option value="Bilgisayar ve Tablet">Bilgisayar ve Tablet</option>
        <option value="Cep Telefonu">Cep Telefonu</option>
      </select>
      <input type="text" id="urunAltKategori" placeholder="Alt Kategori (isteğe bağlı, örn: DSLR)">
      <input type="text" id="urunMarka" placeholder="Marka (örn: Canon)">
      <input type="text" id="urunAd" placeholder="Ürün Adı">
      <textarea id="urunAciklama" placeholder="Açıklama"></textarea>
      <input type="file" id="urunFoto" accept="image/*">
      <input type="text" id="urunSira" placeholder="Sıra No (isteğe bağlı)">
      <button id="urunEkleBtn">Ürünü Ekle</button>
      <div id="urunDurum" style="font-size:12.5px;color:var(--text-dim);"></div>
    </div>
    <div class="card">
      <div id="urunListe"></div>
    </div>

    <h1>Vitrin Fotoğrafları</h1>
    <div class="card">
      <label style="font-size:12.5px;color:var(--text-dim);">Yeni Fotoğraf Yükle</label>
      <input type="file" id="fotoInput" accept="image/*">
      <input type="text" id="fotoAciklama" placeholder="Açıklama (isteğe bağlı)">
      <input type="text" id="fotoSira" placeholder="Sıra No (isteğe bağlı, örn: 1)">
      <button id="fotoYukleBtn">Yükle</button>
      <div id="fotoDurum" style="font-size:12.5px;color:var(--text-dim);"></div>
    </div>

    <div class="card">
      <div id="fotoListe"></div>
    </div>
  </div>

</div>

<script>
const SUPABASE_URL = 'https://efjnszzrybgwompvxkbo.supabase.co';
const SUPABASE_KEY = 'sb_publishable_twigpUVGJb2LgHHox7QV2g_6Umy_gYH';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const loginBox = document.getElementById('loginBox');
const panelBox = document.getElementById('panelBox');

async function checkSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    loginBox.style.display = 'none';
    panelBox.style.display = 'block';
    loadFotolar();
    loadUrunler();
    loadSliderPanel();
  } else {
    loginBox.style.display = 'block';
    panelBox.style.display = 'none';
  }
}
checkSession();

document.getElementById('loginBtn').addEventListener('click', async () => {
  const email = document.getElementById('loginEmail').value.trim();
  const sifre = document.getElementById('loginSifre').value;
  const durum = document.getElementById('loginDurum');
  durum.textContent = 'Giriş yapılıyor...';
  const { error } = await sb.auth.signInWithPassword({ email, password: sifre });
  if (error) {
    durum.textContent = '⚠️ ' + error.message;
  } else {
    checkSession();
  }
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await sb.auth.signOut();
  checkSession();
});

async function loadFotolar() {
  const { data, error } = await sb.from('vitrin_fotograflari').select('*').order('sira_no', { ascending: true, nullsFirst: false });
  const liste = document.getElementById('fotoListe');
  if (error || !data || data.length === 0) {
    liste.innerHTML = '<p style="color:var(--text-dim);font-size:13px;">Henüz fotoğraf yok.</p>';
    return;
  }
  liste.innerHTML = data.map(f => `
    <div class="foto-item">
      <img src="${f.foto_url}" alt="">
      <div class="info">${f.aciklama || '(açıklama yok)'} ${f.sira_no ? '— Sıra: ' + f.sira_no : ''}</div>
      <button data-id="${f.id}" class="sil-btn">Sil</button>
    </div>
  `).join('');
  document.querySelectorAll('.sil-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Bu fotoğrafı silmek istediğine emin misin?')) return;
      await sb.from('vitrin_fotograflari').delete().eq('id', btn.dataset.id);
      loadFotolar();
    });
  });
}

document.getElementById('fotoYukleBtn').addEventListener('click', async () => {
  const fileInput = document.getElementById('fotoInput');
  const aciklama = document.getElementById('fotoAciklama').value.trim();
  const sira = document.getElementById('fotoSira').value.trim();
  const durum = document.getElementById('fotoDurum');
  const file = fileInput.files[0];
  if (!file) {
    durum.textContent = '⚠️ Önce bir dosya seçin.';
    return;
  }
  durum.textContent = 'Yükleniyor...';
  const path = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '_')}`;
  const { error: uploadErr } = await sb.storage.from('Vitrin Fotograflari').upload(path, file);
  if (uploadErr) {
    durum.textContent = '⚠️ Yüklenemedi: ' + uploadErr.message;
    return;
  }
  const { data: urlData } = sb.storage.from('Vitrin Fotograflari').getPublicUrl(path);
  const { error: insertErr } = await sb.from('vitrin_fotograflari').insert({
    foto_url: urlData.publicUrl,
    aciklama: aciklama || null,
    sira_no: sira ? parseInt(sira, 10) : null
  });
  if (insertErr) {
    durum.textContent = '⚠️ Kaydedilemedi: ' + insertErr.message;
    return;
  }
  durum.textContent = '✓ Yüklendi';
  fileInput.value = '';
  document.getElementById('fotoAciklama').value = '';
  document.getElementById('fotoSira').value = '';
  loadFotolar();
});

async function loadSliderPanel() {
  const { data, error } = await sb.from('slider_gorseller').select('*').order('sira_no', { ascending: true, nullsFirst: false });
  const liste = document.getElementById('sliderListe');
  if (error || !data || data.length === 0) {
    liste.innerHTML = '<p style="color:var(--text-dim);font-size:13px;">Henüz slider görseli yok.</p>';
    return;
  }
  liste.innerHTML = data.map(s => `
    <div class="foto-item">
      <img src="${s.foto_url}" alt="">
      <div class="info">${s.baslik || '(başlıksız)'}</div>
      <button data-id="${s.id}" class="slider-sil-btn">Sil</button>
    </div>
  `).join('');
  document.querySelectorAll('.slider-sil-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Bu slider görselini silmek istediğine emin misin?')) return;
      await sb.from('slider_gorseller').delete().eq('id', btn.dataset.id);
      loadSliderPanel();
    });
  });
}

document.getElementById('sliderYukleBtn').addEventListener('click', async () => {
  const fileInput = document.getElementById('sliderInput');
  const baslik = document.getElementById('sliderBaslik').value.trim();
  const altYazi = document.getElementById('sliderAltYazi').value.trim();
  const sira = document.getElementById('sliderSira').value.trim();
  const durum = document.getElementById('sliderDurum');
  const file = fileInput.files[0];
  if (!file) {
    durum.textContent = '⚠️ Önce bir dosya seçin.';
    return;
  }
  durum.textContent = 'Yükleniyor...';
  const path = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '_')}`;
  const { error: uploadErr } = await sb.storage.from('Vitrin Fotograflari').upload(path, file);
  if (uploadErr) {
    durum.textContent = '⚠️ Yüklenemedi: ' + uploadErr.message;
    return;
  }
  const { data: urlData } = sb.storage.from('Vitrin Fotograflari').getPublicUrl(path);
  const { error: insertErr } = await sb.from('slider_gorseller').insert({
    foto_url: urlData.publicUrl,
    baslik: baslik || null,
    alt_yazi: altYazi || null,
    sira_no: sira ? parseInt(sira, 10) : null
  });
  if (insertErr) {
    durum.textContent = '⚠️ Kaydedilemedi: ' + insertErr.message;
    return;
  }
  durum.textContent = '✓ Yüklendi';
  fileInput.value = '';
  document.getElementById('sliderBaslik').value = '';
  document.getElementById('sliderAltYazi').value = '';
  document.getElementById('sliderSira').value = '';
  loadSliderPanel();
});

async function loadUrunler() {
  const { data, error } = await sb.from('urunler').select('*').order('sira_no', { ascending: true, nullsFirst: false });
  const liste = document.getElementById('urunListe');
  if (error || !data || data.length === 0) {
    liste.innerHTML = '<p style="color:var(--text-dim);font-size:13px;">Henüz ürün yok.</p>';
    return;
  }
  liste.innerHTML = data.map(u => `
    <div class="foto-item">
      ${u.foto_url ? `<img src="${u.foto_url}" alt="">` : '<div style="width:60px;height:60px;background:#222;border-radius:6px;flex-shrink:0;"></div>'}
      <div class="info">${u.ad} — ${u.kategori}${u.marka ? ' · ' + u.marka : ''}</div>
      <button data-id="${u.id}" class="urun-sil-btn">Sil</button>
    </div>
  `).join('');
  document.querySelectorAll('.urun-sil-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Bu ürünü silmek istediğine emin misin?')) return;
      await sb.from('urunler').delete().eq('id', btn.dataset.id);
      loadUrunler();
    });
  });
}

document.getElementById('urunEkleBtn').addEventListener('click', async () => {
  const kategori = document.getElementById('urunKategori').value;
  const altKategori = document.getElementById('urunAltKategori').value.trim();
  const marka = document.getElementById('urunMarka').value.trim();
  const ad = document.getElementById('urunAd').value.trim();
  const aciklama = document.getElementById('urunAciklama').value.trim();
  const sira = document.getElementById('urunSira').value.trim();
  const fileInput = document.getElementById('urunFoto');
  const durum = document.getElementById('urunDurum');

  if (!ad) {
    durum.textContent = '⚠️ Ürün adı zorunlu.';
    return;
  }

  let fotoUrl = null;
  const file = fileInput.files[0];
  if (file) {
    durum.textContent = 'Fotoğraf yükleniyor...';
    const path = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '_')}`;
    const { error: uploadErr } = await sb.storage.from('Urun Fotograflari').upload(path, file);
    if (uploadErr) {
      durum.textContent = '⚠️ Fotoğraf yüklenemedi: ' + uploadErr.message;
      return;
    }
    const { data: urlData } = sb.storage.from('Urun Fotograflari').getPublicUrl(path);
    fotoUrl = urlData.publicUrl;
  }

  durum.textContent = 'Kaydediliyor...';
  const { error: insertErr } = await sb.from('urunler').insert({
    kategori, alt_kategori: altKategori || null, marka: marka || null,
    ad, aciklama: aciklama || null, foto_url: fotoUrl,
    sira_no: sira ? parseInt(sira, 10) : null
  });
  if (insertErr) {
    durum.textContent = '⚠️ Kaydedilemedi: ' + insertErr.message;
    return;
  }
  durum.textContent = '✓ Ürün eklendi';
  document.getElementById('urunAltKategori').value = '';
  document.getElementById('urunMarka').value = '';
  document.getElementById('urunAd').value = '';
  document.getElementById('urunAciklama').value = '';
  document.getElementById('urunSira').value = '';
  fileInput.value = '';
  loadUrunler();
});
</script>
</body>
</html>
